# 설교 목록 갱신: 교회 재생목록 + 썸네일의 제목·본문 → data/sermons.json → 바뀌었으면 커밋 (Pages가 1분 안에 배포)
# 1단계(check, 리눅스·10초): 새 설교가 있는지만 본다 → 자주 돌려도 가볍다
# 2단계(update, 맥): 새 설교가 있을 때만 썸네일 글자를 읽고 커밋 (맥 Vision이 맥에서만 된다)
name: 설교 목록 갱신
on:
  schedule:
    # 시각은 UTC (한국 = UTC+9). GitHub 예약 실행은 믿을 수 없다: 정각 예약은 3~4시간 늦고, 촘촘한 예약은 통째로 빠진다
    # (26.11.01. 일요일 밤 20분 예약이 한 번도 안 돎). 그래서 주 담당은 맥(scripts/sermons-bot.sh, launchd 20분마다)이고
    # 여기는 맥이 꺼졌을 때의 예비 — 붐비는 정각을 피해 어긋난 분에 둔다.
    - cron: '7,37 12-17 * * 0' # 일요일 밤 9시 ~ 새벽 2시(한국), 30분마다 — 설교는 보통 밤 9시 40분~11시에 올라온다
    - cron: '17 1-14/3 * * 1'  # 월요일 오전 10시 ~ 밤 11시(한국), 3시간마다 — 늦게 올라오는 주
    - cron: '43 0 * * *'       # 매일 오전 9시 40분(한국) 한 번 — 다른 요일에 올라온 경우 대비
  workflow_dispatch: {} # Actions 탭에서 손으로 돌리기
permissions:
  contents: write
concurrency:
  group: sermons
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/fetch-sermons.mjs --check
  update:
    needs: check
    if: needs.check.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-sermons.mjs
      - run: |
          git diff --quiet data/sermons.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git commit -am '설교 목록 갱신'
          git pull --rebase
          git push
